name: CI/CD Build Checker
on:
  push:
    branches:
      - master
  pull_request:
  merge_group:
permissions:
  contents: read
  pull-requests: write
env:
  NODE_VERSION: '20'

jobs:
  lint:
    name: Syntax & Format Linter
    runs-on: ubuntu-latest
    env:
      CI_JOB_NUMBER: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Uses Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
      - name: Install Dependencies
        run: yarn install --frozen-lockfile
      - name: Test Build
        run: yarn run build
      - name: Test
        run: yarn run test:ci
      - name: Check errors with ESLint
        run: yarn run lint
      - name: Check format with Prettier
        run: yarn run format:check
      # continue-on-error: first PR fails base compare until size-limit is on master
      - name: Bundle size
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: andresz1/size-limit-action@v1.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          package_manager: yarn
          skip_step: build
          script: yarn size --json

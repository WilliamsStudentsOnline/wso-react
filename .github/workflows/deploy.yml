name: Deploy
on:
  push:
    branches:
      - master
      - production

env:
  NODE_VERSION: '20'

jobs:
  deploy-dev:
    name: Deploy to development
    if: github.ref == 'refs/heads/master'
    runs-on: [self-hosted, dev]
    env:
      PATH: /usr/local/bin:/usr/bin:/bin
    steps:
      - name: Dummy deploy
        run: |
          set -euo pipefail
          echo "dev deploy placeholder on $(hostname) (ref=${GITHUB_REF_NAME})"
          echo "replace this job with a real deploy when CD is ready"

  deploy-prod:
    name: Deploy to production
    if: github.ref == 'refs/heads/production'
    runs-on: [self-hosted, prod]
    env:
      PATH: /usr/local/bin:/usr/bin:/bin
    steps:
      - uses: actions/checkout@v4
      - name: Uses Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Dependencies
        run: yarn install --frozen-lockfile
      - name: Bundle site for deployment
        run: yarn build
      - name: Deploy site
        run: |
          set -euo pipefail
          cp -r ./build/* /var/www/wso-react
          sudo systemctl restart nginx
